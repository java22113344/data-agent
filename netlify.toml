# ── The error page ────────────────────────────────────────────────────────
# Netlify serves 404.html automatically for any path that matches no file.
# The explicit rule below additionally makes /404 itself resolvable.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 200
